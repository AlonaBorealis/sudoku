<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1"/>
		<title>Судоку</title>
		<link rel="stylesheet" href="./styles/main.scss">
		<script type="module" src="/index.js"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link
			href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap"
			rel="stylesheet">
	</head>
	<body>
		<div class="board-wrap">
			<div class="win-screen ">
				<div class="win-screen__announce-window">
					<h2 class="win-screen__win-text">Победа!</h2>
					<p class="win-screen__time-text">Время: 1:20</p>
					<div class="win-screen__buttons">
						<button class="win-screen__new-game-button btn">Новая игра</button>
						<button class="win-screen__back-to-board-button btn">Вернуться к
						                                                     доске
						</button>
					</div>
				</div>
			</div>
			<div class="board" role="grid">
				<div class="board__row" role="row">
				<span aria-readonly="true"
				      data-row="0"
				      data-col="0"
				      class="board__cell"
				      role="gridcell"
				>5</span>
				</div>
			</div>
		</div>
		<div class="numbers">
			<button class="numbers__button">1</button>
			<button class="numbers__button">2</button>
			<button class="numbers__button">3</button>
			<button class="numbers__button">4</button>
			<button class="numbers__button">5</button>
			<button class="numbers__button">6</button>
			<button class="numbers__button">7</button>
			<button class="numbers__button">8</button>
			<button class="numbers__button">9</button>
		</div>
	</body>
</html>
